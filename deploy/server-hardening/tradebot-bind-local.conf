# 설치 위치: /etc/systemd/system/tradebot.service.d/bind-local.conf (2026-11-08 서버 점검 조치)
# 기존 화면(Streamlit 8501)을 서버 안에서만 받는다. 바깥에서는 nginx(443, 암호화)로만 들어온다.
# scripts/tradebot_boot.py 가 TRADEBOT_ADDRESS 를 읽는다(기본 0.0.0.0).
# 되돌리기: 이 파일을 지우고 `systemctl daemon-reload && systemctl restart tradebot`.
[Service]
Environment=TRADEBOT_ADDRESS=127.0.0.1
