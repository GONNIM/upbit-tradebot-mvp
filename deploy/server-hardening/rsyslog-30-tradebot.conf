# 설치 위치: /etc/rsyslog.d/30-tradebot.conf (2026-11-08 서버 점검 조치)
# tradebot · tradebot-v2(프로그램 이름 python) 줄이 /var/log/syslog 의 99.5% 였다(하루 약 180MB).
# 이 줄들은 journal(journalctl -u tradebot)에 그대로 남는다. 관찰 판정의 출처도 journal 이다(project-rules).
# 50-default.conf 보다 먼저 읽히도록 30 번으로 둔다.
# 되돌리기: 이 파일을 지우고 `systemctl restart rsyslog`.
if $programname == 'python' then stop
