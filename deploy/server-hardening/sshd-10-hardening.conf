# 설치 위치: /etc/ssh/sshd_config.d/10-hardening.conf (2026-11-08 서버 점검 조치)
# sshd_config 12행의 Include 가 본문보다 먼저 읽히고, sshd 는 처음 읽은 값을 쓴다. 그래서 이 파일이 본문 값을 이긴다.
# 키 로그인은 그대로 된다. 비밀번호 로그인과 화면 전달만 끈다.
# 되돌리기: 이 파일을 지우고 `sshd -t && systemctl reload ssh`.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
