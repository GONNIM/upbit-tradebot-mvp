# v2 프록시 블록 — 배포 승인 대상.
# 넣을 곳: /etc/nginx/sites-enabled/tradebot 의 443 server 블록 안, 기존 `location /` 앞.
# 넣은 뒤: nginx -t  →  systemctl reload nginx
# 되돌리기: 이 블록만 삭제  →  nginx -t  →  systemctl reload nginx
# 다른 블록(Streamlit 8501 프록시, 80 포트 리다이렉트)은 바꾸지 않는다.
# client_max_body_size 는 v2 저장 API 의 본문 상한(64 KiB)을 앞단에서도 건다.

location /v2/ {
    proxy_pass http://127.0.0.1:8502;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
